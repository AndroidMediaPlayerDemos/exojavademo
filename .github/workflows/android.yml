name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  # T3.3 主流程仪器测试（Espresso）：起播、倍速切换、源切换
  instrumented-tests:

    # ubuntu-latest 已切 Ubuntu 26.04（2026-10-19 起）；24.04/26.04 的 20261101 批次镜像
    # KVM 组归属均有回归（见下方 Grant KVM access 步）。钉成熟 24.04 + 显式放权。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # 20261101 批次 runner 镜像（24.04/26.04 皆然）runner 用户不在 kvm 组，/dev/kvm 无权限，
    # 模拟器被 action 降级 -accel off 纯软件模拟、无法启动（run 42443553123/42444816509/42445108071）。
    # chmod 666 在 devtmpfs 上即时生效，无需重新登录生效组归属。
    - name: Grant KVM access and verify
      run: |
        sudo chmod 666 /dev/kvm
        /usr/local/lib/android/sdk/emulator/emulator -accel-check || true
    - name: Run instrumented tests on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_atd   # 仪器测试专用精简镜像，冷启动远快于 google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        emulator-boot-timeout: 25
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest --stacktrace
