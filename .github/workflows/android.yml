name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  # T3.3 主流程仪器测试（Espresso）：起播、倍速切换、源切换
  # T3.1 ABR 弱网实测：用例打点 logcat，脚本按标记限速/恢复，阶段经 Settings.Global 回传
  instrumented-tests:

    # ubuntu-latest 已切 Ubuntu 26.04（2026-10-19 起）；24.04/26.04 的 20261101 批次镜像
    # KVM 组归属均有回归（见下方 Grant KVM access 步）。钉成熟 24.04 + 显式放权。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # 20261101 批次 runner 镜像（24.04/26.04 皆然）runner 用户不在 kvm 组，/dev/kvm 无权限，
    # 模拟器被 action 降级 -accel off 纯软件模拟、无法启动（run 42443553123/42444816509/42445108071）。
    # chmod 666 在 devtmpfs 上即时生效，无需重新登录生效组归属。
    - name: Grant KVM access and verify
      run: |
        sudo chmod 666 /dev/kvm
        /usr/local/lib/android/sdk/emulator/emulator -accel-check || true
    - name: Run instrumented tests on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_atd   # 仪器测试专用精简镜像，冷启动远快于 google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        emulator-boot-timeout: 25
        disable-animations: true
        script: |
          set -e
          # 常规用例（T3.3 主流程三用例；ABR 实测需主机限速协调，用 notClass 隔离）。
          # 注意：单行调用——上一轮续行符 \ 经 action 传递后在第二条调用处断裂，gradle 收到裸 \ 参数
          ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.exo_java_demo.AbrThrottleTest
          # T3.1 ABR 实测：切 DASH 源 → 满速爬档打点 HOLD:high → 限速 edge 等下调打点 HOLD:low
          # → 恢复 full 等回升；阶段经 Settings.Global abr_phase 通知用例
          adb logcat -c
          adb shell settings put global abr_phase none
          ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.example.exo_java_demo.AbrThrottleTest &
          GRADLE_PID=$!
          wait_marker() {
            marker=$1; deadline=$((SECONDS + $2))
            while [ $SECONDS -lt $deadline ]; do
              if adb logcat -d -s ABR_TEST:I 2>/dev/null | grep -q "$marker"; then return 0; fi
              sleep 3
            done
            echo "::error::等待标记 $marker 超时（用例未到达该阶段或已失败）"
            return 1
          }
          wait_marker "HOLD:high" 300
          adb emu network speed edge
          adb shell settings put global abr_phase edge
          wait_marker "HOLD:low" 360
          adb emu network speed full
          adb shell settings put global abr_phase full
          wait "$GRADLE_PID"
          adb emu network speed full
