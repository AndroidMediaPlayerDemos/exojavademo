name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  # T3.3 主流程仪器测试（Espresso）：起播、倍速切换、源切换
  # T3.1 ABR 弱网实测：用例打点 logcat，脚本按标记限速/恢复，阶段经 Settings.Global 回传
  instrumented-tests:

    # ubuntu-latest 已切 Ubuntu 26.04（2026-10-19 起）；24.04/26.04 的 20261101 批次镜像
    # KVM 组归属均有回归（见下方 Grant KVM access 步）。钉成熟 24.04 + 显式放权。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # 20261101 批次 runner 镜像（24.04/26.04 皆然）runner 用户不在 kvm 组，/dev/kvm 无权限，
    # 模拟器被 action 降级 -accel off 纯软件模拟、无法启动（run 42443553123/42444816509/42445108071）。
    # chmod 666 在 devtmpfs 上即时生效，无需重新登录生效组归属。
    - name: Grant KVM access and verify
      run: |
        sudo chmod 666 /dev/kvm
        /usr/local/lib/android/sdk/emulator/emulator -accel-check || true
    - name: Run instrumented tests on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_atd   # 仪器测试专用精简镜像，冷启动远快于 google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        emulator-boot-timeout: 25
        disable-animations: true
        script: |
          # ⚠ 本 action 将 script 逐行各自以独立 sh -c 执行：禁止函数定义、续行符、
          # 跨行变量与多行控制块（run 42447952918/42482408548 两次踩坑实证）。
          # 常规用例（T3.3 主流程三用例；ABR 实测需主机限速协调，用 notClass 隔离）
          ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.exo_java_demo.AbrThrottleTest
          # T3.1 ABR 实测：宿主限速代理（QEMU console network speed 在 google_atd 镜像
          # 交付失真、guest 内核缺整形模块，均已弃用——详见 scripts/abr_shaper_proxy.py 头注）
          nohup python3 scripts/abr_shaper_proxy.py > /tmp/abr_proxy.log 2>&1 &
          n=0; until curl -sf "http://127.0.0.1:8801/__ctrl?bps=0" >/dev/null; do sleep 1; n=$((n+1)); if [ $n -gt 10 ]; then echo "::error::限速代理未就绪"; cat /tmp/abr_proxy.log; exit 1; fi; done
          # 上游预检：经代理拉 MPD + 实测一段 720p 分片吞吐留档（run 42487661428 HOLD:high
          # 超时无任何诊断可看；若 runner→akamai 链路慢于此数，ABR 爬不到 576p 属链路而非用例问题）
          curl -sf --max-time 20 -o /tmp/mpd_probe "http://127.0.0.1:8801/akamai/bbb_30fps/bbb_30fps.mpd" || { echo "::error::代理上游拉取 MPD 失败"; cat /tmp/abr_proxy.log; exit 1; }
          curl -s --max-time 40 -o /dev/null -w "seg_probe http=%{http_code} bytes=%{size_download} speed=%{speed_download}B/s\n" "http://127.0.0.1:8801/akamai/bbb_30fps/bbb_30fps_1280x720_4000k/bbb_30fps_1280x720_4000k_5.m4v"
          adb logcat -c
          adb shell settings put global abr_phase none
          nohup ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.example.exo_java_demo.AbrThrottleTest > /tmp/abr_gradle.log 2>&1 &
          # 轮询落盘再 grep（dash 无进程替换）；用例若提前 BUILD FAILED 立即跳出让诊断先行
          adb logcat -d -s ABR_TEST:I > /tmp/abr_lc.txt 2>/dev/null; n=0; until grep -q "HOLD:high" /tmp/abr_lc.txt || grep -q "BUILD FAILED" /tmp/abr_gradle.log 2>/dev/null; do sleep 3; n=$((n+1)); adb logcat -d -s ABR_TEST:I > /tmp/abr_lc.txt 2>/dev/null; if [ $n -gt 100 ]; then echo "::error::HOLD:high 超时（未爬升到≥480p）"; echo "--- gradle 日志尾 ---"; tail -60 /tmp/abr_gradle.log 2>/dev/null; echo "--- ABR_TEST logcat ---"; cat /tmp/abr_lc.txt; echo "--- 代理日志尾 ---"; tail -20 /tmp/abr_proxy.log; exit 1; fi; done
          grep -q "BUILD FAILED" /tmp/abr_gradle.log 2>/dev/null && { echo "::error::ABR 用例在爬档阶段即失败"; tail -60 /tmp/abr_gradle.log; adb logcat -d -s ABR_TEST:I; exit 1; }
          # 限速 800kbps：用例封顶 576p，在飞分片 ~1.57MB(~16s) < App 30s 读超时，
          # 又压住 270p 档(760+67=827k) 逼 ABR 降到 180p（≤240 断言）
          curl -sf "http://127.0.0.1:8801/__ctrl?bps=800000"
          adb shell settings put global abr_phase slow
          adb logcat -d -s ABR_TEST:I > /tmp/abr_lc.txt 2>/dev/null; n=0; until grep -q "HOLD:low" /tmp/abr_lc.txt || grep -q "BUILD FAILED" /tmp/abr_gradle.log 2>/dev/null; do sleep 3; n=$((n+1)); adb logcat -d -s ABR_TEST:I > /tmp/abr_lc.txt 2>/dev/null; if [ $n -gt 120 ]; then echo "::error::HOLD:low 超时（限速后未下调到≤240p）"; echo "--- gradle 日志尾 ---"; tail -60 /tmp/abr_gradle.log 2>/dev/null; echo "--- ABR_TEST logcat ---"; cat /tmp/abr_lc.txt; exit 1; fi; done
          grep -q "BUILD FAILED" /tmp/abr_gradle.log 2>/dev/null && { echo "::error::ABR 用例在降档阶段即失败"; tail -60 /tmp/abr_gradle.log; adb logcat -d -s ABR_TEST:I; exit 1; }
          curl -sf "http://127.0.0.1:8801/__ctrl?bps=0"
          adb shell settings put global abr_phase full
          # 不能用 pgrep -f "class=..."：本行自身的 sh -c 包装命令行就含该模式串，
          # pgrep 会永远匹配到包装进程 → 死循环（本地 badb49rlx 同陷阱实证）。改轮询构建结果行。
          until grep -qE "BUILD (SUCCESSFUL|FAILED)" /tmp/abr_gradle.log 2>/dev/null; do sleep 5; done
          tail -30 /tmp/abr_gradle.log
          echo "--- ABR_TEST 全程打点 ---"
          adb logcat -d -s ABR_TEST:I | tail -60
          grep -q "BUILD SUCCESSFUL" /tmp/abr_gradle.log || exit 1
